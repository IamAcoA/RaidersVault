<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="t d"><title id="t">1976 Oakland Raiders season poster</title><desc id="d">Original Raiders Vault typography artwork celebrating the 1976 championship season.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#26282b"/></linearGradient></defs><rect width="900" height="700" fill="url(#bg)"/><text x="70" y="115" fill="#85898c" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="8">OAKLAND RAIDERS</text><text x="55" y="410" fill="#f4f1e8" font-family="Arial,Helvetica,sans-serif" font-size="300" font-weight="900" letter-spacing="-20">1976</text><path d="M65 470 H835" stroke="#bfc2c5" stroke-opacity=".35" stroke-width="2"/><text x="70" y="555" fill="#f4f1e8" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="900">13–1</text><text x="330" y="548" fill="#919598" font-family="Georgia,serif" font-size="38">regular season</text><text x="70" y="625" fill="#a5a8ab" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="5">12 STRAIGHT WINS ENTERING SUPER BOWL XI</text></svg>